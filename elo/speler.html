/* ---------- wie heeft een pagina: de leden (FRBE-ledenlijst), plus wie in het clubkampioenschap of voor KRST speelt ---------- */
const LEDEN=(E&&E.leden)||[];const byN=new Map(LEDEN.map(m=>[nrm(m.n),m]));
const SP=new Map();const add=(n,w)=>{if(!n||n==='Bye')return;const k=nrm(n);let s=SP.get(k);if(!s){const m=byN.get(k)||null;s={n:m?m.n:n,m,club:[],ic:false};SP.set(k,s)}if(w&&!s.club.includes(w))s.club.push(w)};

const BY=Object.assign({},(V&&V.club&&V.club.by)||{});const K40=new Set((V&&V.club&&V.club.k40)||[]);

const Ex=(a,b)=>1/(1+10**(Math.max(-400,Math.min(400,b-a))/400));

const NUR={};((V&&V.elo&&V.elo.leden)||[]).forEach(m=>NUR[nrm(m.n)]=m.fr||0);
const NUOF=(n,e)=>{if(E&&E.rNu){const r=E.rNu(n,'',0);if(r)return r}return NUR[nrm(n)]||e};
const TOT=((window.BRON_CLUB||{}).instellingen||{})['elo verwerkt tot']||'';const RDAT=(V&&V.club&&V.club.rondes)||{};

const PER=k=>(RAW[k]&&RAW[k].per)||5,PLD=k=>(RAW[k]&&RAW[k].played!=null)?RAW[k].played:PLAYED,NR=k=>(RAW[k]&&RAW[k].n)||ROUNDS;
function build(key){
  const per=PER(key),PL=PLD(key);const rows=RAW[key].r.map((s,i)=>[Math.floor(i/per)+1,...s.split('|')]);
  const cnt={};rows.forEach(([rd,a,ea,res,b])=>{if(b==='Bye')return;for(const n of [a,b]){const c=cnt[n]??={all:0,ff:0};c.all++;if(res==='0ff-0ff')c.ff++}});
  const gone=new Set(Object.keys(cnt).filter(n=>cnt[n].ff===cnt[n].all));
  const REM=[];const P={};const get=(n,e)=>P[n]??=(P[n]={n,elo:NUOF(n,+e||0),sw:+e||0,de:0,rg:0,rp:0,rs:0,rr:0,w:0,l:0,f:0,open:0,bye:0,fb:0,wins:0,games:0});
  rows.forEach(([rd,a,ea,res,b,eb])=>{if(gone.has(a)||gone.has(b))return;const A=get(a,ea);
    if(b==='Bye'){if(rd<=PL){A.w+=2;A.bye++}else A.fb++;return}

    if(res==='-'){REM.push([a,b]);A.open++;B.open++;if(!A.elo&&B.elo)A.rr++;if(!B.elo&&A.elo)B.rr++;return}

  const L=Object.values(P).map(p=>({...p,pts:p.w/2,max:(p.w+2*p.open+2*p.fb)/2}));
  L.sort((x,y)=>y.pts-x.pts||y.wins-x.wins||y.max-x.max||x.n.localeCompare(y.n,'nl'));
  L.gone=[...gone];L.rem=REM;return L}
function maxflow(n,edges,s,t){const g=Array.from({length:n},()=>[]);const E2=[];for(const [u,v,c] of edges){g[u].push(E2.length);E2.push([v,c]);g[v].push(E2.length);E2.push([u,0])}
  let f=0;for(;;){const lv=new Array(n).fill(-1);lv[s]=0;const q=[s];for(let i=0;i<q.length;i++){const u=q[i];for(const id of g[u]){const [v,c]=E2[id];if(c>0&&lv[v]<0){lv[v]=lv[u]+1;q.push(v)}}}if(lv[t]<0)return f;
    const it=new Array(n).fill(0);const dfs=(u,fl)=>{if(u===t)return fl;for(;it[u]<g[u].length;it[u]++){const id=g[u][it[u]],[v,c]=E2[id];if(c>0&&lv[v]===lv[u]+1){const d=dfs(v,Math.min(fl,c));if(d>0){E2[id][1]-=d;E2[id^1][1]+=d;return d}}}return 0};
    let d;while((d=dfs(s,1e9))>0)f+=d}}
function feasible(L,p,S,T){const idx=new Map(L.map((q,i)=>[q.n,i]));const n0=L.length;const src=n0,snk=n0+1;let id=n0+2;const ed=[];let need=0;
  const base=q=>q.w+2*q.fb;

function safeFrom(L,p,K=5){const others=L.filter(q=>q!==p);if(others.length<K)return p.w+2*p.fb;if(K<=0)return null;const sets=combos(others,K);const lo=p.w+2*p.fb,hi=p.w+2*p.fb+2*p.open;let best=null;
  for(let S=hi;S>=lo;S--){if(sets.some(T=>feasible(L,p,S,T)))break;best=S}return best}
function chances(L,KS=[5],N=20000){let seed=12345;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const est=p=>{if(p.elo)return p.elo;const n=p.games||0;const frac=n?(p.w-2*p.bye)/(2*n):.5;return Math.round(1400+400*(2*frac-1)*n/(n+3))};
  const LAM=0.9,R=L.map(p=>est(p)+AGEB(p.n)),idx=new Map(L.map((p,i)=>[p.n,i]));
  const tf=L.reduce((a,p)=>a+p.f/2,0),tg=L.reduce((a,p)=>a+p.games+p.f/2,0),GF=Math.min(0.2,(tf+1)/(tg+10));
  const pf=L.map(p=>(p.f/2+2*GF)/(p.games+p.f/2+2));
  const W=1600,EW=new Float64Array(2*W+1),ED=new Float64Array(2*W+1);for(let d=-W;d<=W;d++){const e=1/(1+10**(d/400)),dr=0.30*(1-Math.abs(2*e-1))+0.05;EW[d+W]=Math.max(0,e-dr/2);ED[d+W]=Math.min(1,e+dr/2)}
  const G=L.rem.map(([a,b])=>[idx.get(a),idx.get(b)]);
  const base=L.map(p=>p.w+2*p.fb),wins0=L.map(p=>p.wins),CNT=KS.map(()=>new Array(L.length).fill(0)),POS=[0,1,2].map(()=>new Array(L.length).fill(0)),fm=new Array(L.length);
  const pts=new Array(L.length),wn=new Array(L.length),ord=L.map((_,i)=>i);
  for(let k=0;k<N;k++){for(let i=0;i<L.length;i++){pts[i]=base[i];wn[i]=wins0[i];fm[i]=(Math.min(2,rnd()*3|0)-1)*50}
    for(const [i,j] of G){if(rnd()<pf[i]||rnd()<pf[j])continue;let d=Math.round(LAM*(R[j]-R[i])-(fm[i]-fm[j]));d=d<-W?-W:d>W?W:d;const r=rnd();if(r<EW[d+W]){pts[i]+=2;wn[i]++}else if(r<ED[d+W]){pts[i]++;pts[j]++}else{pts[j]+=2;wn[j]++}}
    const tb=L.map(()=>rnd());ord.sort((x,y)=>pts[y]-pts[x]||wn[y]-wn[x]||tb[y]-tb[x]);for(let r=0;r<ord.length;r++){const i=ord[r];if(r<3)POS[r][i]++;for(let q=0;q<KS.length;q++)if(r<KS[q])CNT[q][i]++}}

function zones(key,n){const D=(RAW[key]&&RAW[key].doel)||[{t:'top',n:5}];return D.map(z=>{const k=z.t==='zakken'?Math.max(0,n-z.n):Math.min(z.n,n);
  const L={top:{kans:'kans op de top '+z.n,sure:'zeker top '+z.n,out:'buiten top '+z.n,need:'zeker top '+z.n},
    titel:{kans:'kans op de titel',sure:'zeker kampioen',out:'',need:'zeker kampioen'},

function reeks(key){if(CACHE[key])return CACHE[key];const L=build(key),n=L.length,Z=zones(key,n);const KS=[...new Set(Z.map(z=>z.k))];chances(L,KS);L.thZ={};

/* ---------- grafiek van de rating ---------- */
function grafiek(m){if(!M.length)return '';const i1=M.length-1;let i0=0;while(i0<i1&&![0,1,2].some(t=>m.s[t][i0]!=null))i0++;
  const W=720,H=200,pl=42,pr=12,pt=12,pb=24;const S=[0,1,2].map(t=>m.s[t].slice(i0,i1+1));const v=S.flat().filter(x=>x!=null);if(v.length<2)return '';
  let mn=Math.min(...v),mx=Math.max(...v);if(mx-mn<40){mn-=20;mx+=20}const n=i1-i0+1;const sx=i=>pl+i*(W-pl-pr)/Math.max(1,n-1),sy=x=>pt+(mx-x)*(H-pt-pb)/(mx-mn);
  let g='';const st=Math.max(10,Math.round((mx-mn)/4/10)*10);for(let y=Math.ceil(mn/st)*st;y<=mx;y+=st)g+=`<line x1="${pl}" x2="${W-pr}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${pl-6}" y="${sy(y)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${y}</text>`;
  const stap=Math.max(1,Math.ceil(n/10));for(let i=0;i<n;i+=stap)g+=`<text x="${sx(i)}" y="${H-6}" text-anchor="middle" font-size="11" fill="var(--muted)">${mkort(M[i0+i])}</text>`;
  const iM=M.indexOf('2024-03')-i0;if(iM>0&&iM<n)g+=`<line x1="${sx(iM)}" x2="${sx(iM)}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${sx(iM)+4}" y="${H-pb-4}" font-size="10" fill="var(--muted)">correctie FIDE</text>`;
  let lines='';S.forEach((s,t)=>{let d='';s.forEach((x,i)=>{if(x==null)return;d+=(d?'L':'M')+sx(i).toFixed(1)+' '+sy(x).toFixed(1)});if(d)lines+=`<path d="${d}" fill="none" stroke="var(--l${t})" stroke-width="${t===0?2.6:1.5}" stroke-linejoin="round" opacity="${t===0?1:.8}"/>`;
    s.forEach((x,i)=>{if(x!=null&&m.g[t][i0+i])lines+=`<circle cx="${sx(i)}" cy="${sy(x)}" r="${t===0?3.2:2.2}" fill="var(--l${t})"><title>${TN[t]} ${mlab(M[i0+i])}: ${x} (${m.g[t][i0+i]} partij${m.g[t][i0+i]>1?'en':''})</title></circle>`})});
  return `<div class="grafiek"><div class="lg">${[0,1,2].map(t=>S[t].some(x=>x!=null)?`<span><i style="background:var(--l${t})"></i>${TN[t]}</span>`:'').join('')}<span>· bolletje = maand met verwerkte partijen</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="verloop van de FIDE-rating per maandlijst">${g}${lines}</svg></div>`}

  let h=`<section><h2>Elo</h2><div class="card"><div class="nums">${nums}${hi!=null&&hi!==cur?`<div class="num"><b>${hi}</b><span>hoogste sinds ${mlab(M[0]).replace(/^\w+ /,'')}<br>${mlab(hiM)}</span></div>`:''}${m.s[1][last]!=null?`<div class="num"><b>${m.s[1][last]}</b><span>rapid</span></div>`:''}${m.s[2][last]!=null?`<div class="num"><b>${m.s[2][last]}</b><span>blitz</span></div>`:''}${pmin!=null?`<div class="num"><b class="sm">${pmin}–${pmax}</b><span>prognose na het clubkampioenschap (alles verloren tot alles gewonnen)</span></div>`:''}</div>
${grafiek(m)}

  if(P.length){let lt='',sub='';h+=`<details class="fold" open><summary>Nog te verwerken <span>${P.length} partij${P.length>1?'en':''} · ${f1(pd)} · nog niet op een FIDE-lijst</span></summary><div class="in"><div class="board"><table><thead><tr><th class="l">Datum</th><th class="l">Toernooi</th><th class="l">Tegenstander</th><th>Elo</th><th>Uitslag</th><th>Elo ±</th></tr></thead><tbody>${P.map(x=>{const t=x.tour.replace(/ r(\d+)$/,'');const r=(x.tour.match(/ r(\d+)$/)||[])[1];const g=fpZoek(m,x.o,dag(x.dt,-1),dag(x.dt,1))||(/clubkampioenschap|interclub/i.test(x.tour)?stPartij(m.n,x.o,/interclub/i.test(x.tour)):null);return `<tr><td class="l nw">${dkort(x.dt)}</td><td class="l tw">${esc(t)}${r?' <span class="na">r'+r+'</span>':''}</td><td class="l">${spLink(x.o)}</td><td>${x.or||'<span class="na">–</span>'}</td><td>${rs(x.r)}${plk(g)}</td><td class="${x.chg>0?'up':x.chg<0?'down':''}">${x.chg!=null?f1(x.chg):''}</td></tr>`}).join('')}<tr class="tot"><td class="l" colspan="5">Samen (K ${P[0].K})</td><td>${f1(pd)}</td></tr></tbody></table></div><p class="na small">Gespeelde partijen van het clubkampioenschap, de interclub en de gekoppelde toernooien die nog op geen enkele FIDE-lijst staan. De winst of het verlies is berekend met de FIDE-formule.</p></div></details>`}
  /* FIDE-toernooien per maandlijst, nieuwste eerst */
  const T=[];for(const t of [0,1,2])for(const x of m.games[t]){const k=t+'|'+x.ym+'|'+x.tour;let o=T.find(y=>y.k===k);if(!o){o={k,t,ym:x.ym,tour:x.tour,pl:x.pl||'',d1:x.d1||'',d2:x.d2||'',G:[]};T.push(o)}o.G.push(x)}
  T.sort((a,b)=>b.ym.localeCompare(a.ym)||(b.d1||'').localeCompare(a.d1||'')||a.t-b.t);

function clubDeel(s){const ks=RK.filter(k=>s.club.includes(k));if(!ks.length)return '';let h='<section><h2>Clubkampioenschap</h2>';
  for(const k of ks.slice().reverse()){const {L,Z}=reeks(k);const p=L.find(q=>q.n===s.club_n?.[k]||nrm(q.n)===nrm(s.n));if(!p)continue;const per=PER(k),PL=PLD(k);const lab=(V.club.labels&&V.club.labels[k])||'Reeks '+k;

      return `<div class="num"><b class="${c}">${pct(v)}</b><span>${z.kans}<br>${zk}</span></div>${z.t==='med'&&p.pos?`<div class="num"><b>${pct(p.pos[0])}</b><span>goud · zilver ${pct(p.pos[1])} · brons ${pct(p.pos[2])}</span></div>`:''}`}).join('');
    const R=RAW[k].rondes||RDAT;const rows=[];RAW[k].r.forEach((row,i)=>{const [a,ea,res,b,eb]=row.split('|');if(nrm(a)!==nrm(p.n)&&nrm(b)!==nrm(p.n))return;const rd=Math.floor(i/per)+1;rows.push({rd,d:R[rd]||'',a,ea,res,b,eb,wit:nrm(a)===nrm(p.n)})});

function icDeel(s){if(!IC)return '';const G=(IC.ind||[]).filter(g=>nrm(g.speler)===nrm(s.n)).sort((a,b)=>a.ronde-b.ronde);const inKern=(IC.spelers||[]).some(n=>nrm(n)===nrm(s.n));if(!G.length&&!inKern)return '';

function agendaDeel(s){const A=[],AG=(V&&V.agenda)||{};
  for(const k of RK.filter(k=>s.club.includes(k))){const per=PER(k),R=RAW[k].rondes||RDAT,lab=(V.club.labels&&V.club.labels[k])||'reeks '+k;RAW[k].r.forEach((row,i)=>{const [a,ea,res,b,eb]=row.split('|');if(res!=='-'&&b!=='Bye')return;if(nrm(a)!==nrm(s.n)&&nrm(b)!==nrm(s.n))return;const rd=Math.floor(i/per)+1;const d=R[rd]||'';if(b==='Bye'){if(rd>PLD(k)&&d>=TODAY)A.push({d,what:`Clubkampioenschap ${lab}, ronde ${rd}`,detail:'bye (vrij, 1 punt)'});return}
    const wit=nrm(a)===nrm(s.n),o=wit?b:a,oe=NUOF(o,+(wit?eb:ea)||0);const past=d&&d<TODAY;A.push({d:past?'':d,what:`Clubkampioenschap ${lab}, ronde ${rd}`,detail:`${wit?'met wit':'met zwart'} tegen ${nice(o)}${oe?' ('+oe+')':''}${AG.club&&AG.club.plaats&&!past?' · '+AG.club.plaats+(AG.club.uur?', '+AG.club.uur:''):''}`,warn:past?'nog in te halen (oorspronkelijk '+dkort(d)+')'+(()=>{const ih=((AG.inhaal)||[]).filter(x=>x>=TODAY).sort()[0];return ih?' · volgende inhaaldag '+dlong(ih):''})():''})})}
  if(IC&&(IC.spelers||[]).some(n=>nrm(n)===nrm(s.n)))for(const g of IC.kalender||[])if(g.d>=TODAY)A.push({d:g.d,what:`Interclub ${IC.team}, ronde ${g.r}`,detail:`${g.thuis?'thuis tegen':'uit bij'} ${g.opp} · de opstelling is nog niet gekend`});

  /* gekoppelde toernooien waarin hij speelde */

const platN=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
/* gekoppeld als de voor- en familienaam samen in het artikel staan, of een voor- of familienaam die maar een keer in de club voorkomt (bv. Borys) */
window.TW_NIEUWS_KOPPEL=function(naam,alle,L){const delen=n=>{const [l,f]=String(n||'').split(', ');return {L:platN(l),F:platN(f||'').split(' ').filter(v=>v.length>1)}};
  const ik=delen(naam);if(!ik.L||!ik.F.length)return [];const tv={},ta={};
  for(const n of alle){const d=delen(n);new Set(d.F).forEach(v=>tv[v]=(tv[v]||0)+1);if(d.L)ta[d.L]=(ta[d.L]||0)+1}
  const vol=ik.F.flatMap(v=>[v+' '+ik.L,ik.L+' '+v]),uV=ik.F.filter(v=>v.length>=3&&tv[v]===1),uA=ik.L.length>=3&&ta[ik.L]===1?ik.L:'';
  return (L||[]).filter(x=>{const n=(x.n||[]).map(q=>' '+q+' '),w=new Set(x.w||[]);
    if(vol.some(p=>n.some(q=>q.includes(' '+p+' '))))return true;   // voor- en familienaam samen
    const ander=v=>(x.n||[]).some(q=>{const t=q.split(' ');for(let i=0;i<t.length-1;i++)if(t[i]===v&&!ik.L.startsWith(t[i+1]))return true;return false});   // bv. "Tom Piceu" is niet Tom Veys
    if(uV.some(v=>w.has(v)&&!ander(v)))return true;                   // een voornaam die maar een keer in de club voorkomt
    if(uA)return uA.includes(' ')?n.some(q=>q.includes(' '+uA+' ')):w.has(uA);   // idem voor de familienaam
    return false})};
window.TW_IN_NIEUWS=n=>window.TW_NIEUWS_KOPPEL(n,ALLE.map(x=>x.n),window.TW_CLUBSITE);
